<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050508">
<title>Scanner Farm • Black Hole Server</title>
<style>
:root{--bg:#050508;--panel:#0e0e14;--line:#272738;--text:#f4f4f7;--muted:#9a9aaa;--ok:#56f39a;--bad:#ff6b7a;--warn:#ffd166;--purple:#9b5cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#25123f 0,#0b0712 30%,var(--bg) 65%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 24px)}.wrap{max-width:780px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:20px;font-weight:850}.back,.btn{border:1px solid #3a2b51;background:#171020;color:white;border-radius:12px;padding:10px 12px;text-decoration:none;font-weight:750;font-size:13px}.hero{margin:14px 0;background:linear-gradient(180deg,rgba(155,92,255,.17),rgba(155,92,255,.04));border:1px solid #35264b;border-radius:22px;padding:18px}.hero h1{margin:0 0 5px;font-size:26px}.hero p{margin:0;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;text-align:center}.metric strong{font-size:24px;display:block}.metric span{font-size:11px;color:var(--muted)}.list{display:flex;flex-direction:column;gap:10px}.scanner{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.name{font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:4px}.status{font-size:11px;font-weight:850;border-radius:999px;padding:6px 9px;border:1px solid #4a3b1f;background:#231c0d;color:var(--warn)}.status.ok{color:var(--ok);border-color:#164c31;background:#0b2518}.status.alert,.status.error{color:var(--bad);border-color:#5a2028;background:#2a1014}.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.detail{background:#09090e;border:1px solid #20202d;border-radius:11px;padding:9px}.detail b{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.detail span{font-size:12px}.actions{margin-top:13px;display:flex;gap:9px;flex-wrap:wrap}.note{font-size:12px;color:var(--muted);margin:10px 0}.footer{text-align:center;color:#666677;font-size:12px;margin-top:16px}
</style>
</head>
<body><main class="wrap">
<div class="top"><div class="brand">🕳️ Black Hole Server</div><a class="back" href="./">← Control Center</a></div>
<section class="hero"><h1>📡 Scanner Farm</h1><p>Multiple automated scanners checking your services, bots, APIs, and crypto movement.</p></section>
<section class="summary"><div class="metric"><strong id="ok">—</strong><span>OK</span></div><div class="metric"><strong id="alerts">—</strong><span>ALERTS</span></div><div class="metric"><strong id="total">—</strong><span>SCANNERS</span></div></section>
<div class="actions"><button class="btn" id="scanBtn" onclick="scanNow()">Run Scan Now</button><button class="btn" onclick="loadScanners()">Refresh</button></div>
<div class="note" id="note">Connecting to Scanner Farm…</div>
<section class="list" id="list"></section>
<div class="footer" id="footer">Black Hole Scanner Farm v1</div>
</main>
<script>
const FARM='https://black-hole-scanner-farm-production.up.railway.app';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(v){return v==null?'—':v;}
function render(items){let ok=0,alerts=0;document.getElementById('list').innerHTML=items.map(s=>{const st=(s.status||'UNKNOWN').toLowerCase();if(st==='ok')ok++;else alerts++;const value=s.type==='crypto'?(s.priceUsd!=null?'$'+Number(s.priceUsd).toLocaleString():'—'):(s.latencyMs!=null?s.latencyMs+' ms':'—');const label=s.type==='crypto'?'Latest price':'Latency';return `<div class="scanner"><div class="head"><div><div class="name">${esc(s.name)}</div><div class="sub">${esc(s.type)} scanner</div></div><span class="status ${esc(st)}">${esc((s.status||'UNKNOWN').toUpperCase())}</span></div><div class="details"><div class="detail"><b>${label}</b><span>${esc(value)}</span></div><div class="detail"><b>Detail</b><span>${esc(s.detail||'—')}</span></div></div></div>`}).join('');document.getElementById('ok').textContent=ok;document.getElementById('alerts').textContent=alerts;document.getElementById('total').textContent=items.length;}
async function loadScanners(){const note=document.getElementById('note');note.textContent='Checking scanners…';try{const r=await fetch(`${FARM}/scanners`,{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);render(d.scanners||[]);note.textContent=`Automatic scans every ${d.scanIntervalMinutes||5} minutes.`;document.getElementById('footer').textContent='Last scan: '+(d.lastRun?new Date(d.lastRun).toLocaleTimeString():'starting');}catch(e){note.textContent='Scanner Farm is still deploying or unavailable: '+e.message;}}
async function scanNow(){const b=document.getElementById('scanBtn');b.disabled=true;b.textContent='Scanning…';try{const r=await fetch(`${FARM}/scan-now`,{method:'POST'});const d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);render(d.scanners||[]);document.getElementById('footer').textContent='Last scan: '+new Date(d.lastRun).toLocaleTimeString();}catch(e){document.getElementById('note').textContent='Scan failed: '+e.message;}finally{b.disabled=false;b.textContent='Run Scan Now';}}
loadScanners();setInterval(loadScanners,60000);
</script></body></html>
