<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050508"><title>Black Hole Code Runner</title><style>:root{--bg:#050508;--panel:#0e0e14;--line:#29293b;--text:#f5f5f7;--muted:#9a9aaa;--purple:#9b5cff;--ok:#56f39a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#25123f 0,#0b0712 30%,var(--bg) 62%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:calc(env(safe-area-inset-top) + 16px) 14px 24px;min-height:100vh}.wrap{max-width:820px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.back,.btn{border:1px solid #3a2b51;background:#171020;color:white;border-radius:12px;padding:10px 12px;text-decoration:none;font-weight:750}.hero,.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:12px}.hero{background:linear-gradient(180deg,rgba(155,92,255,.18),rgba(155,92,255,.04));border-color:#35264b}.muted{color:var(--muted);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}.field,textarea,select{width:100%;background:#08080d;color:#fff;border:1px solid #303042;border-radius:12px;padding:11px;font:inherit}textarea{min-height:260px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.out{min-height:180px;white-space:pre-wrap;background:#050507;border:1px solid #20202b;border-radius:14px;padding:12px;color:#b8ffcf;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.ok{color:var(--ok)}</style></head><body><main class="wrap"><div class="top"><strong>🕳️ Black Hole Server</strong><a class="back" href="./?v=27">← Dashboard</a></div><section class="hero"><h1>▶ Black Hole Code Runner</h1><div class="muted">Run Python or JavaScript in an isolated sandbox. Execution is time-limited and separated from your main Railway server.</div></section><section class="card"><div id="status" class="muted">Checking runner…</div><select id="lang" style="margin-top:12px"><option value="python">Python</option><option value="javascript">JavaScript</option></select><textarea id="code" spellcheck="false">print("Hello from Black Hole")</textarea><div class="row" style="margin-top:10px"><button id="run" class="btn">▶ Run Code</button><button class="btn" onclick="code.value=lang.value==='python'?'print(\"Hello from Black Hole\")':'console.log(\"Hello from Black Hole\")'">Reset</button></div></section><section class="card"><div class="muted" style="margin-bottom:8px">Program output</div><div id="out" class="out">Ready.</div></section></main><script>const API='https://black-hole-code-runner-production.up.railway.app';const statusEl=document.getElementById('status'),out=document.getElementById('out'),code=document.getElementById('code'),lang=document.getElementById('lang');lang.onchange=()=>{code.value=lang.value==='python'?'print("Hello from Black Hole")':'console.log("Hello from Black Hole")'};async function check(){try{const r=await fetch(API+'/health',{cache:'no-store'});const d=await r.json();statusEl.textContent=r.ok?'Online • '+d.languages.join(' + ')+' • isolated sandbox':'Offline';statusEl.className='muted '+(r.ok?'ok':'')}catch{statusEl.textContent='Runner is still deploying or unavailable.'}}document.getElementById('run').onclick=async()=>{out.textContent='Running…';const b=document.getElementById('run');b.disabled=true;try{const r=await fetch(API+'/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language:lang.value,code:code.value})});const d=await r.json();if(!r.ok)out.textContent='Error: '+(d.error||r.status);else out.textContent=(d.stdout||'')+(d.stderr?'\n[stderr]\n'+d.stderr:'')+'\n\nExit code: '+d.code}catch(e){out.textContent='Error: '+e.message}finally{b.disabled=false}};check();</script></body></html>
