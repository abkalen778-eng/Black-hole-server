<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050508"><title>Black Hole Cloud</title><style>:root{--bg:#050508;--panel:#0e0e14;--line:#29293b;--text:#f5f5f7;--muted:#9a9aaa;--ok:#56f39a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#25123f 0,#0b0712 30%,var(--bg) 62%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:calc(env(safe-area-inset-top) + 16px) 14px 24px;min-height:100vh}.wrap{max-width:860px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.back,.btn{border:1px solid #3a2b51;background:#171020;color:#fff;border-radius:12px;padding:10px 12px;text-decoration:none;font-weight:750}.hero,.card{border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:12px;background:var(--panel)}.hero{background:linear-gradient(180deg,rgba(155,92,255,.18),rgba(155,92,255,.04));border-color:#35264b}.muted{color:var(--muted);font-size:13px}.ok{color:var(--ok)}input{width:100%;background:#08080d;color:#fff;border:1px solid #303042;border-radius:12px;padding:11px}.files{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.file{border:1px solid #242435;border-radius:14px;padding:12px;background:#09090e}.file strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.progress{font-size:12px;color:var(--muted);margin-top:8px}@media(max-width:560px){.files{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><strong>🕳️ Black Hole Server</strong><a class="back" href="./?v=27">← Dashboard</a></div><section class="hero"><h1>☁️ Black Hole Cloud</h1><div class="muted">Private photo and file storage controlled from your Black Hole Server. After verifying an upload, you can remove the local iPhone copy to free device space.</div></section><section class="card"><div id="status" class="muted">Checking storage…</div><input id="pick" type="file" multiple accept="image/*,video/*,.pdf,.txt,.zip" style="margin-top:12px"><div class="actions"><button id="upload" class="btn">Upload Selected Files</button><button id="refresh" class="btn">Refresh</button></div><div id="progress" class="progress">No upload in progress.</div></section><section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><strong>Your Cloud Files</strong><span id="count" class="muted"></span></div><div id="files" class="files"><div class="muted">Loading…</div></div></section></main><script>const API='https://black-hole-cloud-production.up.railway.app';const statusEl=document.getElementById('status'),box=document.getElementById('files'),count=document.getElementById('count'),progress=document.getElementById('progress'),pick=document.getElementById('pick');function fmt(n){if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';if(n<1073741824)return(n/1048576).toFixed(1)+' MB';return(n/1073741824).toFixed(2)+' GB'}async function health(){try{const r=await fetch(API+'/health',{cache:'no-store'}),d=await r.json();statusEl.textContent=d.configured?'Online • private storage connected':'Online • storage credentials still needed';statusEl.className='muted '+(d.configured?'ok':'')}catch{statusEl.textContent='Cloud backend is still deploying or unavailable.'}}async function load(){box.innerHTML='<div class="muted">Loading…</div>';try{const r=await fetch(API+'/files',{cache:'no-store'}),d=await r.json();if(!r.ok){box.innerHTML='<div class="muted">'+(d.error||'Could not load files')+'</div>';count.textContent='';return}count.textContent=d.files.length+' files';box.innerHTML='';if(!d.files.length){box.innerHTML='<div class="muted">No files uploaded yet.</div>';return}d.files.forEach(f=>{const el=document.createElement('div');el.className='file';const title=document.createElement('strong');title.textContent=f.name;const meta=document.createElement('div');meta.className='muted';meta.textContent=fmt(f.size)+' • '+(f.updated?new Date(f.updated).toLocaleString():'');const a=document.createElement('div');a.className='actions';const open=document.createElement('button');open.className='btn';open.textContent='Open';open.onclick=async()=>{const rr=await fetch(API+'/download-url?key='+encodeURIComponent(f.key)),dd=await rr.json();if(rr.ok)location.href=dd.downloadUrl;else alert(dd.error||'Could not open')};const del=document.createElement('button');del.className='btn';del.textContent='Delete';del.onclick=async()=>{if(!confirm('Delete '+f.name+' from Black Hole Cloud?'))return;const rr=await fetch(API+'/file',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:f.key})});if(rr.ok)load();else{const dd=await rr.json();alert(dd.error||'Delete failed')}};a.append(open,del);el.append(title,meta,a);box.appendChild(el)})}catch(e){box.innerHTML='<div class="muted">Error: '+e.message+'</div>'}}document.getElementById('upload').onclick=async()=>{const files=[...pick.files];if(!files.length)return;for(let i=0;i<files.length;i++){const f=files[i];progress.textContent='Preparing '+(i+1)+'/'+files.length+': '+f.name;const r=await fetch(API+'/upload-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.name,type:f.type||'application/octet-stream'})}),d=await r.json();if(!r.ok){progress.textContent='Error: '+(d.error||'Could not prepare upload');return}progress.textContent='Uploading '+(i+1)+'/'+files.length+': '+f.name;const up=await fetch(d.uploadUrl,{method:'PUT',headers:{'Content-Type':f.type||'application/octet-stream'},body:f});if(!up.ok){progress.textContent='Upload failed for '+f.name;return}}progress.textContent='Upload complete. Refreshing…';pick.value='';await load();progress.textContent='Upload complete. Verify the file opens before deleting the iPhone copy.'};document.getElementById('refresh').onclick=load;health();load();</script></body></html>
