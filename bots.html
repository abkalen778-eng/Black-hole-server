<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#050508" />
<title>Discord Bot Monitor • Black Hole Server</title>
<style>
:root{--bg:#050508;--panel:#0e0e14;--line:#272738;--text:#f4f4f7;--muted:#9a9aaa;--ok:#56f39a;--bad:#ff6b7a;--warn:#ffd166;--purple:#9b5cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#25123f 0,#0b0712 30%,var(--bg) 62%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 24px)}.wrap{max-width:760px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.brand{font-size:20px;font-weight:850}.back{color:#fff;text-decoration:none;border:1px solid #3a2b51;background:#171020;border-radius:12px;padding:9px 11px;font-size:13px;font-weight:700}.hero{border:1px solid #35264b;background:linear-gradient(180deg,rgba(155,92,255,.17),rgba(155,92,255,.04));border-radius:22px;padding:20px;margin-bottom:14px}.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;color:var(--muted);font-size:14px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;text-align:center}.metric strong{display:block;font-size:24px}.metric span{color:var(--muted);font-size:11px}.list{display:flex;flex-direction:column;gap:10px}.bot{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px}.bothead{display:flex;justify-content:space-between;align-items:center;gap:10px}.name{font-weight:800}.sub{color:var(--muted);font-size:12px;margin-top:4px;overflow-wrap:anywhere}.status{font-size:11px;font-weight:850;border-radius:999px;padding:6px 9px;border:1px solid #4a3b1f;color:var(--warn);background:#231c0d}.status.online{color:var(--ok);border-color:#164c31;background:#0b2518}.status.offline{color:var(--bad);border-color:#5a2028;background:#2a1014}.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.detail{background:#09090e;border:1px solid #20202d;border-radius:11px;padding:9px}.detail b{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}.detail span{font-size:12px}.actions{display:flex;gap:9px;margin-top:13px}.btn{border:1px solid #3a2b51;background:#171020;color:#fff;border-radius:12px;padding:11px 12px;font-weight:750;font-size:13px}.note{background:#0b2518;border:1px solid #164c31;color:#9df7be;border-radius:15px;padding:12px;margin-bottom:12px;font-size:13px;line-height:1.4}.footer{text-align:center;color:#666677;font-size:12px;margin-top:16px}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div class="brand">🕳️ Black Hole Server</div><a class="back" href="./">← Control Center</a></div>
<section class="hero"><h1>🤖 Discord Bot Monitor</h1><p>Direct health checks for your Railway-hosted Discord bots.</p></section>
<div id="setupNote" class="note">Checking your bots…</div>
<section class="summary"><div class="metric"><strong id="onlineCount">—</strong><span>ONLINE</span></div><div class="metric"><strong id="problemCount">—</strong><span>OFFLINE</span></div><div class="metric"><strong id="totalCount">3</strong><span>TOTAL</span></div></section>
<section id="botList" class="list"></section>
<div class="actions"><button class="btn" onclick="loadBots()">↻ Refresh</button></div>
<div class="footer" id="lastChecked">Black Hole Bot Monitor v2</div>
</main>
<script>
const bots=[
 {name:'Pump.fun Scanner',project:'zestful-perception',url:'https://pumpfun-discord-scanner-production.up.railway.app/health'},
 {name:'FanDuel Scanner',project:'faithful-adaptation',url:'https://fanduel-scanner-production.up.railway.app/health'},
 {name:'Pocket Option Bot',project:'faithful-adaptation',url:'https://pumpfun-discord-scanner-production-10b7.up.railway.app/health'}
];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function checkBot(bot){const started=performance.now();try{const r=await fetch(bot.url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();return {...bot,online:d.status==='online',latency:Math.round(performance.now()-started),service:d.service||'bot'};}catch(e){return {...bot,online:false,latency:null,service:'unreachable',error:e.message};}}
function render(results){let online=0;document.getElementById('botList').innerHTML=results.map(b=>{if(b.online)online++;return `<div class="bot"><div class="bothead"><div><div class="name">${esc(b.name)}</div><div class="sub">${esc(b.project)} • ${esc(b.service)}</div></div><span class="status ${b.online?'online':'offline'}">${b.online?'ONLINE':'OFFLINE'}</span></div><div class="details"><div class="detail"><b>Latency</b><span>${b.latency===null?'—':b.latency+' ms'}</span></div><div class="detail"><b>Health URL</b><span>${b.online?'Responding':'No response'}</span></div></div></div>`}).join('');document.getElementById('onlineCount').textContent=online;document.getElementById('problemCount').textContent=results.length-online;document.getElementById('totalCount').textContent=results.length;document.getElementById('setupNote').textContent=online===results.length?'All monitored bots are responding.':`${online} of ${results.length} bots are responding.`;}
async function loadBots(){document.getElementById('setupNote').textContent='Checking your bots…';render(await Promise.all(bots.map(checkBot)));document.getElementById('lastChecked').textContent='Last checked: '+new Date().toLocaleTimeString();}
loadBots();setInterval(loadBots,60000);
</script>
</body>
</html>
