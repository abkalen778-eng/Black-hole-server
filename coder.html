<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050508"><title>Black Hole Coder</title><style>:root{--bg:#050508;--panel:#0e0e14;--line:#29293b;--text:#f5f5f7;--muted:#9a9aaa;--purple:#9b5cff;--ok:#56f39a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#25123f 0,#0b0712 30%,var(--bg) 62%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 24px);min-height:100vh}.wrap{max-width:820px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.back,.btn{border:1px solid #3a2b51;background:#171020;color:white;border-radius:12px;padding:10px 12px;text-decoration:none;font-weight:750}.hero{margin:14px 0;background:linear-gradient(180deg,rgba(155,92,255,.18),rgba(155,92,255,.04));border:1px solid #35264b;border-radius:22px;padding:20px}.hero h1{margin:0 0 6px}.muted{color:var(--muted);font-size:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:12px}.row{display:grid;grid-template-columns:160px 1fr;gap:10px}.field,textarea,select{width:100%;background:#08080d;color:white;border:1px solid #303042;border-radius:12px;padding:11px;font:inherit}textarea{min-height:150px;resize:vertical}.output{background:#050507;border:1px solid #20202b;border-radius:14px;padding:13px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:180px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.status{font-size:12px;color:var(--muted)}.status.ok{color:var(--ok)}@media(max-width:560px){.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><strong>🕳️ Black Hole Server</strong><a class="back" href="./?v=25">← Dashboard</a></div><section class="hero"><h1>🧑‍💻 Black Hole Coder</h1><div class="muted">Your custom coding bot — not Codex.</div></section><section class="card"><div id="status" class="status">Checking bot…</div><div class="row" style="margin-top:12px"><select id="lang"><option>Auto</option><option>Python</option><option>JavaScript</option><option>TypeScript</option><option>HTML/CSS</option><option>Node.js</option><option>SQL</option><option>Java</option><option>C++</option><option>C#</option><option>Go</option><option>Rust</option><option>Bash</option></select><input id="token" class="field" type="password" placeholder="Access token (if enabled)"></div><textarea id="prompt" placeholder="Example: Build me a Node.js API with a /health endpoint and explain where every file goes."></textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button id="ask" class="btn">Generate Code</button><button class="btn" onclick="document.getElementById('output').textContent='Ready.'">Clear</button></div></section><section class="card"><div class="muted" style="margin-bottom:8px">Coder output</div><div id="output" class="output">Ready.</div></section></main><script>const API='https://black-hole-coding-bot-production.up.railway.app';const status=document.getElementById('status'),out=document.getElementById('output'),token=document.getElementById('token');token.value=localStorage.getItem('blackHoleCodingToken')||'';token.addEventListener('change',()=>localStorage.setItem('blackHoleCodingToken',token.value));async function check(){try{const r=await fetch(API+'/health',{cache:'no-store'}),d=await r.json();status.textContent=r.ok?`Online • ${d.model} • ${d.languages.length} language packs`:'Offline';status.className='status '+(r.ok?'ok':'');}catch{status.textContent='Bot is still deploying or unavailable.';}}document.getElementById('ask').onclick=async()=>{const p=document.getElementById('prompt').value.trim();if(!p)return;out.textContent='Thinking…';const btn=document.getElementById('ask');btn.disabled=true;try{const r=await fetch(API+'/generate',{method:'POST',headers:{'Content-Type':'application/json','X-Black-Hole-Token':token.value},body:JSON.stringify({prompt:p,language:document.getElementById('lang').value})});const d=await r.json();out.textContent=r.ok?d.reply:'Error: '+(d.error||r.status);}catch(e){out.textContent='Error: '+e.message}finally{btn.disabled=false}};check();</script></body></html>
