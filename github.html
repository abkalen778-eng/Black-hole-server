<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050508"><title>Black Hole GitHub Manager</title><style>:root{--bg:#050508;--panel:#0e0e14;--line:#29293b;--text:#f5f5f7;--muted:#9a9aaa;--purple:#9b5cff;--ok:#56f39a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#25123f 0,#0b0712 30%,var(--bg) 62%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:calc(env(safe-area-inset-top) + 16px) 14px 24px;min-height:100vh}.wrap{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.back,.btn{border:1px solid #3a2b51;background:#171020;color:white;border-radius:12px;padding:10px 12px;text-decoration:none;font-weight:750}.hero{margin:14px 0;background:linear-gradient(180deg,rgba(155,92,255,.18),rgba(155,92,255,.04));border:1px solid #35264b;border-radius:22px;padding:20px}.hero h1{margin:0 0 6px}.muted{color:var(--muted);font-size:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.repo{padding:12px;border:1px solid #252536;border-radius:14px;background:#09090e;margin-top:9px}.repo strong{display:block}.repo .meta{font-size:12px;color:var(--muted);margin-top:4px}.status{font-size:12px;color:var(--muted)}.status.ok{color:var(--ok)}.list{max-height:420px;overflow:auto}.branch,.commit{padding:9px 0;border-bottom:1px solid #1d1d29}.commit:last-child,.branch:last-child{border-bottom:0}.commit a{color:#c6a6ff;text-decoration:none}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.field{width:100%;background:#08080d;color:white;border:1px solid #303042;border-radius:12px;padding:11px;font:inherit}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><strong>🕳️ Black Hole Server</strong><a class="back" href="./?v=github1">← Dashboard</a></div><section class="hero"><h1>🐙 GitHub Manager</h1><div class="muted">Browse repositories, branches and recent commits from your phone.</div></section><section class="card"><div id="status" class="status">Connecting to GitHub Manager…</div><div class="row" style="margin-top:10px"><button class="btn" id="refresh">Refresh Repos</button><a class="btn" href="https://github.com/abkalen778-eng" target="_blank">Open GitHub</a></div></section><div class="grid"><section class="card"><h3>Repositories</h3><div id="repos" class="list muted">Loading…</div></section><section class="card"><h3 id="detailTitle">Repository Details</h3><div id="details" class="muted">Choose a repository to inspect branches and recent commits.</div></section></div></main><script>const API='https://black-hole-github-manager-production.up.railway.app';const status=document.getElementById('status'),reposEl=document.getElementById('repos'),details=document.getElementById('details'),detailTitle=document.getElementById('detailTitle');async function j(url){const r=await fetch(url,{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);return d}async function check(){try{const d=await j(API+'/health');status.textContent=`Online • ${d.owner} • ${d.mode}`;status.className='status ok'}catch(e){status.textContent='Manager unavailable: '+e.message}}async function loadRepos(){reposEl.textContent='Loading…';try{const d=await j(API+'/repos');reposEl.innerHTML='';d.repos.forEach(r=>{const el=document.createElement('div');el.className='repo';el.innerHTML=`<strong>${r.name}</strong><div class="meta">${r.language||'No primary language'} • ${r.default_branch} • updated ${new Date(r.updated_at).toLocaleString()}</div><div class="row" style="margin-top:8px"><button class="btn">Inspect</button><a class="btn" href="${r.html_url}" target="_blank">GitHub</a></div>`;el.querySelector('button').onclick=()=>inspect(r.full_name);reposEl.appendChild(el)});if(!d.repos.length)reposEl.textContent='No repositories found.'}catch(e){reposEl.textContent='Error: '+e.message}}async function inspect(full){detailTitle.textContent=full;details.textContent='Loading branches and commits…';const [owner,repo]=full.split('/');try{const [b,c]=await Promise.all([j(`${API}/repo/${owner}/${repo}/branches`),j(`${API}/repo/${owner}/${repo}/commits`)]);details.innerHTML=`<h4>Branches</h4>${b.branches.map(x=>`<div class="branch">🌿 ${x.name}<div class="meta">${(x.sha||'').slice(0,8)}</div></div>`).join('')}<h4 style="margin-top:18px">Recent Commits</h4>${c.commits.map(x=>`<div class="commit"><a href="${x.html_url}" target="_blank">${(x.message||'').split('\n')[0]}</a><div class="meta">${x.author||'Unknown'} • ${new Date(x.date).toLocaleString()} • ${(x.sha||'').slice(0,8)}</div></div>`).join('')}`}catch(e){details.textContent='Error: '+e.message}}document.getElementById('refresh').onclick=loadRepos;check();loadRepos();</script></body></html>
